name: Deploy SmartDiscount to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartdiscount-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ECR_URI: ${{ secrets.AWS_ECR_URI }}
  AWS_CONTAINER_NAME: smartdiscount-app
  APP_PORT: 3000

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, tag, and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ECR_URI }}:latest
            ${{ env.AWS_ECR_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ECR_URI: ${{ env.AWS_ECR_URI }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_CONTAINER_NAME: ${{ env.AWS_CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}

          # Runtime app variables
          NODE_ENV: production
          HOST: 0.0.0.0
          PORT: 3000
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SCOPES: ${{ secrets.SCOPES }}
          SHOPIFY_APP_URL: ${{ secrets.SHOPIFY_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SHOPIFY_CAPPED_ORDER_FUNCTION_ID: ${{ secrets.SHOPIFY_CAPPED_ORDER_FUNCTION_ID }}
          SHOPIFY_FREE_GIFT_FUNCTION_ID: ${{ secrets.SHOPIFY_FREE_GIFT_FUNCTION_ID }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >-
            AWS_REGION,AWS_ECR_URI,IMAGE_TAG,AWS_CONTAINER_NAME,APP_PORT,
            NODE_ENV,HOST,PORT,
            SHOPIFY_API_KEY,SHOPIFY_API_SECRET,SCOPES,
            SHOPIFY_APP_URL,DATABASE_URL,SESSION_SECRET,SHOPIFY_CAPPED_ORDER_FUNCTION_ID,SHOPIFY_FREE_GIFT_FUNCTION_ID
          script: |
            set -euo pipefail

            APP_DIR="$HOME/smartdiscount-app"
            ENV_FILE="${APP_DIR}/.env.prod"
            LOG_DIR="${APP_DIR}/logs"
            ECR_REGISTRY="${AWS_ECR_URI%%/*}"
            IMAGE_URI="${AWS_ECR_URI}:${IMAGE_TAG}"
            CANDIDATE_NAME="${AWS_CONTAINER_NAME}-candidate"
            OLD_NAME="${AWS_CONTAINER_NAME}-old"

            # Always remove the runtime env file from EC2, on any exit path.
            trap 'rm -f "$ENV_FILE"' EXIT

            echo "==> Create secure app directory"
            mkdir -p "$APP_DIR" "$LOG_DIR"
            chmod 700 "$APP_DIR"

            echo "==> ECR login using EC2 IAM role"
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "==> Pull immutable image: $IMAGE_URI"
            docker pull "$IMAGE_URI"

            echo "==> Write runtime environment file"
            umask 077
            cat > "$ENV_FILE" <<EOF
            NODE_ENV=$NODE_ENV
            HOST=$HOST
            PORT=$PORT
            SHOPIFY_API_KEY=$SHOPIFY_API_KEY
            SHOPIFY_API_SECRET=$SHOPIFY_API_SECRET
            SCOPES=$SCOPES
            SHOPIFY_APP_URL=$SHOPIFY_APP_URL
            DATABASE_URL=$DATABASE_URL
            SESSION_SECRET=$SESSION_SECRET
            SHOPIFY_CAPPED_ORDER_FUNCTION_ID=$SHOPIFY_CAPPED_ORDER_FUNCTION_ID
            SHOPIFY_FREE_GIFT_FUNCTION_ID=$SHOPIFY_FREE_GIFT_FUNCTION_ID
            EOF
            chmod 600 "$ENV_FILE"

            echo "==> Ensure persistent logs directory"
            mkdir -p "$LOG_DIR"
            touch "${LOG_DIR}/app.log"
            chmod 755 "$LOG_DIR"
            chmod 644 "${LOG_DIR}/app.log"

            # Clean up leftovers from a previously interrupted deploy.
            docker rm -f "$CANDIDATE_NAME" 2>/dev/null || true
            docker rm -f "$OLD_NAME" 2>/dev/null || true

            echo "==> Start candidate on 127.0.0.1:3001 (old container keeps serving :3000)"
            # Boot runs `prisma migrate deploy` — migrations are applied HERE,
            # while the old container still serves traffic.
            docker run -d \
              --name "$CANDIDATE_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -v "${LOG_DIR}:/app/logs" \
              -p "127.0.0.1:3001:3000" \
              "$IMAGE_URI"

            echo "==> Health-check candidate on :3001"
            HEALTH="fail"
            for i in $(seq 1 36); do
              # Fast-fail if the candidate crashed right after start.
              if [ "$(docker inspect -f '{{.State.Status}}' "$CANDIDATE_NAME" 2>/dev/null)" != "running" ]; then
                break
              fi
              if curl -fsS --max-time 5 "http://127.0.0.1:3001/api/health" > /dev/null 2>&1; then
                HEALTH="ok"
                break
              fi
              sleep 5
            done

            if [ "$HEALTH" != "ok" ]; then
              echo "==> WARNING: candidate failed its health check; old container was never stopped"
              docker rm -f "$CANDIDATE_NAME" 2>/dev/null || true
              docker logs --tail 100 "$CANDIDATE_NAME" 2>/dev/null || true
              exit 1
            fi
            echo "==> Candidate healthy: migrations applied, DB reachable."

            echo "==> Promote: stop old container, keep it as rollback target"
            HAD_OLD=false
            if docker inspect "$AWS_CONTAINER_NAME" > /dev/null 2>&1; then
              docker stop "$AWS_CONTAINER_NAME"
              docker rename "$AWS_CONTAINER_NAME" "$OLD_NAME"
              # Prevent the stopped old container from auto-starting on a Docker
              # daemon restart and fighting for :3000.
              docker update --restart=no "$OLD_NAME"
              HAD_OLD=true
            fi

            # Recreate the final container under the real name on :3000.
            # Ports cannot be rebound without recreating; the second `prisma
            # migrate deploy` is idempotent and near-instant.
            docker rm -f "$CANDIDATE_NAME" 2>/dev/null || true

            if ! docker run -d \
              --name "$AWS_CONTAINER_NAME" \
              -p "127.0.0.1:${APP_PORT}:3000" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -v "${LOG_DIR}:/app/logs" \
              "$IMAGE_URI"; then
              echo "==> WARNING: final container failed to start — rolling back"
              docker rm -f "$AWS_CONTAINER_NAME" 2>/dev/null || true
              if [ "$HAD_OLD" = "true" ]; then
                docker rename "$OLD_NAME" "$AWS_CONTAINER_NAME"
                docker update --restart=unless-stopped "$AWS_CONTAINER_NAME"
                docker start "$AWS_CONTAINER_NAME"
                echo "==> Old container restarted — service restored"
              fi
              exit 1
            fi

            echo "==> Health-check final container on :3000"
            HEALTH="fail"
            for i in $(seq 1 24); do
              if [ "$(docker inspect -f '{{.State.Status}}' "$AWS_CONTAINER_NAME" 2>/dev/null)" != "running" ]; then
                break
              fi
              if curl -fsS --max-time 5 "http://127.0.0.1:${APP_PORT}/api/health" > /dev/null 2>&1; then
                HEALTH="ok"
                break
              fi
              sleep 5
            done

            if [ "$HEALTH" != "ok" ]; then
              echo "==> WARNING: final container failed its health check — rolling back"
              docker rm -f "$AWS_CONTAINER_NAME" 2>/dev/null || true
              if [ "$HAD_OLD" = "true" ]; then
                docker rename "$OLD_NAME" "$AWS_CONTAINER_NAME"
                docker update --restart=unless-stopped "$AWS_CONTAINER_NAME"
                docker start "$AWS_CONTAINER_NAME"
                echo "==> Old container restarted — service restored"
              fi
              exit 1
            fi

            echo "==> Finalize: remove old container, clean unused Docker layers"
            docker rm -f "$OLD_NAME" 2>/dev/null || true
            docker image prune -f
            echo "==> Deployment completed successfully"