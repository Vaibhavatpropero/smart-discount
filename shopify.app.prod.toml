# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f3e34f65b2d12ca440507e09aa6ad160"
name = "smart-discounts"
application_url = "https://smartdiscount.propero.in"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled", "app_subscriptions/update", "orders/create", "orders/updated", "orders/cancelled", "refunds/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_products,read_shipping,write_discounts"

[auth]
redirect_urls = ["https://smartdiscount.propero.in/api/auth"]
